# Risk limits (SPEC section 8.2, Annex D section 1).
#
# Changing anything in this file is a two-person operation (SPEC section 13.2).
# The `bounds` block below is what stops a misplaced decimal: a config
# declaring per_trade_risk 0.2 instead of 0.02 fails to LOAD rather than
# sizing every position ten times too large, and it fails at load time rather
# than at the first fill.

schema_version: 1

# One definition of equity, used everywhere. Two definitions in one system
# means two different drawdown numbers and an argument during an incident.
equity_definition: cash_plus_unrealised_plus_accrued

limits:
  per_trade_risk:           {value: 0.02, unit: equity_fraction,     action: reject}
  daily_loss:               {value: 0.03, unit: equity_fraction,     action: flatten_and_halt}
  weekly_loss:              {value: 0.07, unit: equity_fraction,     action: flatten_and_halt}
  drawdown_amber:           {value: 0.06, unit: equity_fraction,     action: alert}
  drawdown_soft:            {value: 0.08, unit: equity_fraction,     action: halve_allocations}
  drawdown_hard:            {value: 0.12, unit: equity_fraction,     action: full_stop}
  gross_exposure:           {value: 3.0,  unit: equity_multiple,     action: reject_new}
  asset_concentration:      {value: 0.25, unit: book_fraction,       action: reject}
  venue_concentration:      {value: 0.40, unit: capital_fraction,    action: alert_and_sweep}
  liquidation_distance:     {value: 0.25, unit: pct_from_mark,       action: auto_deleverage}
  single_order_equity_frac: {value: 0.02, unit: equity_fraction,     action: reject}
  single_order_median_mult: {value: 5.0,  unit: multiple,            action: reject}
  order_rate:               {value: 0.7,  unit: venue_limit_fraction, action: throttle}
  consecutive_rejects:      {value: 5,    unit: count_per_strategy,  action: disable_strategy}
  backtest_divergence_z:    {value: -2.0, unit: z_score_30d,         action: disable_strategy}
  feed_staleness_s:         {value: 30.0, unit: seconds,             action: reject}
  clock_drift_ms:           {value: 100.0, unit: milliseconds,       action: halt}

# Hard ranges. A value outside its range fails the load (SPEC section 8.5 #3).
bounds:
  per_trade_risk:           [0.0001, 0.05]
  daily_loss:               [0.005,  0.10]
  weekly_loss:              [0.01,   0.20]
  drawdown_amber:           [0.01,   0.20]
  drawdown_soft:            [0.02,   0.20]
  drawdown_hard:            [0.05,   0.25]
  gross_exposure:           [1.0,    5.0]
  asset_concentration:      [0.05,   1.0]
  venue_concentration:      [0.10,   1.0]
  liquidation_distance:     [0.05,   0.90]
  single_order_equity_frac: [0.0001, 0.10]
  single_order_median_mult: [1.0,    50.0]
  order_rate:               [0.1,    0.95]
  consecutive_rejects:      [1,      50]
  backtest_divergence_z:    [-5.0,  -1.0]
  feed_staleness_s:         [1.0,    300.0]
  clock_drift_ms:           [10.0,   1000.0]

# The drawdown ladder must stay ordered: amber < soft < hard. Enforced at load.
