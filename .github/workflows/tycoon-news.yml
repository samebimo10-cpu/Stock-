name: Tycoon Rush weekly news pack
# Every Monday, fetch real headlines for each region of the game and publish
# them with the site. The game shows them in place of its "noise" headlines when
# the phone is online; offline it falls back to generated ones.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch this week's headlines
        run: python3 scripts/tycoon_news.py
      - name: Save the pack to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tycoon/news/weekly.json || true
          git commit -m "Tycoon Rush news pack $(date -u +%G-W%V)" || { echo "No change"; exit 0; }
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin "$GITHUB_REF_NAME" || break
            sleep 5
          done
          echo "::warning::Could not save the news pack; the site is still published with it."
      # A push made with the workflow token does not start other workflows, so
      # this one publishes the site itself.
      - name: Assemble the site
        run: ./scripts/assemble_site.sh _site
      - name: Check whether GitHub Pages is enabled
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
