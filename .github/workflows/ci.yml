name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: stockselector allocate --mode sample --objective growth --risk 4 --budget 20000 --currency USD --horizon 5

  douvalue:
    name: DouValue farm app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Domain and event-log tests
        run: node --test "douvalue/tests/**/*.test.mjs"

  tradesys:
    name: Crypto trading system
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: crypto
      - name: Tests
        run: python -m pytest -q
        working-directory: crypto
      - name: Doctests
        run: python -m pytest --doctest-modules src/tradesys -q
        working-directory: crypto
      - name: Phase 0 gates
        run: python -m tradesys.cli selfcheck
        working-directory: crypto
