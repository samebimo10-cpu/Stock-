<meta property="og:description" content="Plan your money and see your future. A private wealth planner, produced by Ebims.">
<meta property="og:site_name" content="Tycoon Rush by Ebims">
<meta property="og:type" content="website">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face { font-family: 'Figtree'; src: url('fonts/figtree-400.woff2') format('woff2'); font-weight: 400 600; font-display: swap; }
@font-face { font-family: 'Figtree'; src: url('fonts/figtree-700.woff2') format('woff2'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'Figtree'; src: url('fonts/figtree-800.woff2') format('woff2'); font-weight: 800 900; font-display: swap; }

:root {
  color-scheme: light;
  --bg: #f4f6f5; --surface: #ffffff; --surface-2: #eef2f0; --line: #dde4e1;
  --text: #14211c; --text-2: #4a5a54; --muted: #6b7a74;
  --brand: #0f5e4c; --brand-ink: #ffffff; --brand-soft: #e2f0eb;
  --s1: #2a78d6; --s2: #eb6834;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --cother: #a3aca8; --neg-bar: #e34948;
  --good: #0ca30c; --good-text: #006300; --good-bg: #e6f5e6;
  --warn: #b26b00; --warn-bg: #fbf0dc;
  --bad: #d03b3b; --bad-bg: #fbe7e7;
  --grid: #e7ecea; --shadow: 0 1px 2px rgba(20, 33, 28, .06), 0 4px 14px rgba(20, 33, 28, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1412; --surface: #18201d; --surface-2: #202a26; --line: #2c3833;
    --text: #f2f6f4; --text-2: #c3cec9; --muted: #95a39d;
    --brand: #3fb894; --brand-ink: #062a20; --brand-soft: #173a30;
    --s1: #3987e5; --s2: #d95926;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --cother: #5f6a65; --neg-bar: #e66767;
    --good: #0ca30c; --good-text: #52c452; --good-bg: #14301a;
    --warn: #e0a33a; --warn-bg: #33270f;
    --bad: #e66767; --bad-bg: #3a1a1a;
    --grid: #26302c; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1412; --surface: #18201d; --surface-2: #202a26; --line: #2c3833;
  --text: #f2f6f4; --text-2: #c3cec9; --muted: #95a39d;
  --brand: #3fb894; --brand-ink: #062a20; --brand-soft: #173a30;
  --s1: #3987e5; --s2: #d95926;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --cother: #5f6a65; --neg-bar: #e66767;
  --good: #0ca30c; --good-text: #52c452; --good-bg: #14301a;
  --warn: #e0a33a; --warn-bg: #33270f;
  --bad: #e66767; --bad-bg: #3a1a1a;
  --grid: #26302c; --shadow: none;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
p { margin: 0; }
.muted { color: var(--muted); }
.fine { color: var(--muted); font-size: 13px; text-align: center; margin: 14px 0; display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.live { width: 12px; height: 12px; fill: var(--good); stroke: none; }
:focus-visible { outline: 3px solid var(--s1); outline-offset: 2px; border-radius: 6px; }

/* frame */
.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand b { display: block; font-weight: 800; font-size: 17px; }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: -2px; }
.logo { width: 34px; height: 34px; flex: none; }
.logo rect { fill: var(--brand); }
.logo path { fill: none; stroke: var(--brand-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.logo.big { width: 64px; height: 64px; }
.busy { font-size: 12px; color: var(--muted); padding: 4px 10px; border-radius: 99px; background: var(--surface-2); }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--text-2); }
.icon-btn:hover { background: var(--surface-2); }
.page { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabbar button { display: grid; justify-items: center; gap: 2px; padding: 6px 0; border-radius: 12px; color: var(--muted); font-size: 11.5px; font-weight: 700; min-width: 0; }
.tabbar button.on { color: var(--brand); background: var(--brand-soft); }

/* blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.sec { font-size: 15px; font-weight: 800; letter-spacing: .01em; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.card .sec-h { margin-bottom: 0; }
.hero { display: grid; gap: 2px; padding: 4px 2px; }
.lbl { color: var(--muted); font-size: 13px; font-weight: 700; }
.big { font-size: clamp(30px, 9vw, 44px); font-weight: 900; letter-spacing: -.02em; line-height: 1.1; }
.neg, .down { color: var(--bad); }
.up { color: var(--good-text); }
.health { text-align: left; }
.health .pc { font-size: 40px; font-weight: 900; line-height: 1; }
.health .go, .nudge .ic:last-child { color: var(--brand); font-weight: 700; display: flex; align-items: center; gap: 2px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 99px; width: max-content; }
.status .ic { width: 16px; height: 16px; stroke-width: 2.5; }
.status.good { background: var(--good-bg); color: var(--good-text); }
.status.warn { background: var(--warn-bg); color: var(--warn); }
.status.bad { background: var(--bad-bg); color: var(--bad); }
.health.good { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.health.warn { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.health.bad { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.good-edge { border-left: 4px solid var(--good); }
.warn-edge { border-left: 4px solid var(--warn); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; box-shadow: var(--shadow); }
.tile span { color: var(--muted); font-size: 13px; }
.tile b { font-size: 20px; font-weight: 800; }
.tile.bad b { color: var(--bad); }
.tile.warn b { color: var(--warn); }
.nudge { display: flex; align-items: center; gap: 12px; grid-template-columns: none; text-align: left; border-color: var(--brand); }
.nudge > span { flex: 1; display: grid; }
.nudge small { color: var(--muted); }
.nudge .ic:first-child { color: var(--brand); width: 28px; height: 28px; }
.step { display: grid; gap: 6px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; text-align: left; box-shadow: var(--shadow); }
.step b { font-size: 16px; }
.step p { color: var(--text-2); font-size: 14px; }
.step.urgent { border-left: 4px solid var(--bad); }
.step.important { border-left: 4px solid var(--warn); }
.step.good { border-left: 4px solid var(--good); }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.summary div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; }
.summary span { color: var(--muted); font-size: 12px; }
.summary b { font-size: 16px; font-weight: 800; overflow-wrap: anywhere; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; }
.row:last-child { border-bottom: 0; }
button.row:hover, label.row:hover { background: var(--surface-2); }
label.row { cursor: pointer; }
.row > span:first-child { display: grid; min-width: 0; }
.row small { color: var(--muted); font-size: 13px; }
.row .amt { font-weight: 800; text-align: right; display: grid; justify-items: end; white-space: nowrap; }
.row .amt small { font-weight: 700; }
.row.total { background: var(--surface-2); }
.danger-row b { color: var(--bad); }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-left: 6px; vertical-align: middle; }
.pad { padding: 14px; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ans { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.ans span { color: var(--muted); font-size: 13px; }
.ans b { font-size: 18px; font-weight: 800; }
.ans small { color: var(--muted); font-size: 12px; }
.wi { min-height: 3em; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.compare div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; }
.compare span, .compare small { color: var(--muted); font-size: 13px; }
.compare b { font-size: 17px; }
.debt-plan { margin-top: 10px; }
.good-text { color: var(--good-text); display: flex; gap: 6px; align-items: flex-start; font-weight: 700; }
.linkish { color: var(--s1); text-decoration: underline; font-weight: 700; }
.prose { display: grid; gap: 10px; }

/* forms */
.field { display: grid; gap: 4px; }
.field > span:first-child { font-weight: 700; font-size: 14px; }
.field small { color: var(--muted); font-size: 13px; }
input:not([type=range]):not([type=radio]):not([type=file]), select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); min-height: 46px; }
input:focus, select:focus { border-color: var(--s1); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--s1) 25%, transparent); }
.money-in { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.money-in:focus-within { border-color: var(--s1); box-shadow: 0 0 0 3px color-mix(in srgb, var(--s1) 25%, transparent); }
.money-in i { font-style: normal; color: var(--muted); padding: 0 4px 0 12px; font-weight: 700; }
.money-in i:last-child { padding: 0 12px 0 4px; }
.money-in input { border: 0 !important; box-shadow: none !important; background: transparent !important; }
input[type=range] { width: 100%; accent-color: var(--brand); height: 32px; }
.seg-row { display: grid; gap: 6px; }
.seg-row > span { font-weight: 700; font-size: 14px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button, .seg label { padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.seg button.on, .seg label:has(input:checked) { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.seg input { accent-color: var(--brand); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 18px; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn.small .ic { width: 16px; height: 16px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.danger { color: var(--bad); }
.btn.wide { width: 100%; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.btn-row .btn { flex: 1; }
details summary { cursor: pointer; font-weight: 700; padding: 8px 0; }
.pair { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; align-items: end; margin-bottom: 8px; }
.pair b { align-self: center; }
.pair2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
.place-edit { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.place-edit .pair { grid-template-columns: 1fr 1fr; }
.place-edit .pair:has(> :nth-child(4)) { grid-template-columns: 1fr 1fr 1fr 1fr; }
h3.sub { font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
@media (max-width: 420px) { .pair2, .place-edit .pair:has(> :nth-child(4)) { grid-template-columns: 1fr 1fr; } }
.type-grid { display: grid; gap: 8px; }
.type { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; text-align: left; background: var(--surface); }
.type:hover { border-color: var(--brand); }
.type small { color: var(--muted); font-size: 13px; }
.results { display: grid; gap: 4px; }
.res { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); text-align: left; }
.res small { color: var(--muted); }

/* sheet */
#layer { position: fixed; inset: 0; z-index: 20; }
.scrim { position: absolute; inset: 0; background: rgba(5, 12, 9, .45); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow: auto; background: var(--bg); border-radius: 22px 22px 0 0; padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; max-width: 720px; margin: 0 auto; }
.sheet form { display: grid; gap: 12px; }
.sheet-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sheet-h h2 { font-size: 20px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; z-index: 30; max-width: calc(100% - 32px); text-align: center; }

/* charts */
.chart { margin: 0; position: relative; }
.chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 12px; }
.chart .tick.strong { fill: var(--text-2); font-weight: 700; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .line.s1 { stroke: var(--s1); }
.chart .line.s2 { stroke: var(--s2); }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart .dot.s1 { fill: var(--s1); }
.chart .dot.s2 { fill: var(--s2); }
.chart .band.outer { fill: var(--s1); opacity: .1; }
.chart .band.inner { fill: var(--s1); opacity: .12; }
.chart .marker { stroke: var(--muted); stroke-width: 1; }
.chart .goal { stroke: var(--text-2); stroke-width: 1; }
.chart .cross { stroke: var(--text-2); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .tip { position: absolute; top: 4px; min-width: 150px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; display: grid; gap: 2px; box-shadow: var(--shadow); pointer-events: none; }
.chart figcaption { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; font-size: 13px; color: var(--text-2); }
.key { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
.sw.s1 { background: var(--s1); }
.sw.s2 { background: var(--s2); }
.sw.band-key { height: 10px; background: color-mix(in srgb, var(--s1) 20%, transparent); }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(84px, 30%) 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.bar-label { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 12px; }
.bar-track i { display: block; height: 100%; background: var(--s1); border-radius: 0 4px 4px 0; }
.bar-val { font-weight: 800; display: flex; gap: 6px; align-items: baseline; }
.bar-val small { color: var(--muted); font-weight: 700; }

/* onboarding */
.ob { max-width: 520px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 32px; display: grid; gap: 16px; }
.ob-prog { display: flex; gap: 6px; }
.ob-prog i { flex: 1; height: 4px; border-radius: 99px; background: var(--line); }
.ob-prog i.on { background: var(--brand); }
.ob-card { display: grid; gap: 14px; }
.ob-card form { display: grid; gap: 12px; }
.ob h1 { font-size: 30px; font-weight: 900; letter-spacing: -.02em; }
.ob h2 { font-size: 24px; font-weight: 800; }
.ticks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.ticks li { display: flex; gap: 8px; align-items: center; font-weight: 700; }
.ticks .ic { color: var(--good-text); }

/* v2: groups, stats, tables, stacked chart, impact bars */
.group-h { display: flex; justify-content: space-between; align-items: baseline; margin: 12px 4px 6px; font-size: 13px; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.group-h b { color: var(--text); text-transform: none; letter-spacing: 0; font-size: 14px; }
.group-t { font-size: 13px; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; }
.stat-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.stat span { color: var(--muted); font-size: 12px; }
.stat b { font-size: 17px; font-weight: 800; }
.stat.bad b { color: var(--bad); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--muted); font-weight: 700; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td:first-child, th:first-child { padding-left: 2px; white-space: normal; min-width: 7em; }
th:not(:first-child), td:not(:first-child) { text-align: right; }
tr:last-child td { border-bottom: 0; }
.yby { font-size: 13px; }
.yby tr.mark td { background: var(--brand-soft); font-weight: 700; }
td.neg { color: var(--bad); }
.list.flat { border: 0; background: none; border-radius: 0; }
.list.flat .row { padding-left: 0; padding-right: 0; }
.seg.small button { padding: 5px 10px; font-size: 13px; }
.chart .area { stroke: var(--surface); stroke-width: 1.5; stroke-linejoin: round; }
.chart .area.c1 { fill: var(--c1); } .chart .area.c2 { fill: var(--c2); } .chart .area.c3 { fill: var(--c3); }
.chart .area.c4 { fill: var(--c4); } .chart .area.c5 { fill: var(--c5); } .chart .area.c6 { fill: var(--c6); } .chart .area.cother { fill: var(--cother); }
.sq { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.sq.c1 { background: var(--c1); } .sq.c2 { background: var(--c2); } .sq.c3 { background: var(--c3); } .sq.c4 { background: var(--c4); } .sq.c5 { background: var(--c5); } .sq.c6 { background: var(--c6); } .sq.cother { background: var(--cother); }
.dbars { display: grid; gap: 10px; }
